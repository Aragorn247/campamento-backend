<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Campamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">
        <!-- SECCIÓN 1: LOGIN -->
        <div id="login-section">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario (Email):</label>
                    <input type="email" id="username" required placeholder="admin@campamento.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit">Entrar</button>
            </form>
            <div id="message"></div>
        </div>

        <!-- SECCIÓN 2: PANEL DE ACTIVIDADES (Se muestra tras hacer login) -->
        <div id="dashboard-section" class="hidden">
            <h2>Panel de Actividades</h2>
            <p style="color: #666;">Listado de actividades disponibles en el campamento:</p>
            
            <div id="activities-list" class="activities-grid">
                <!-- Se cargan dinámicamente desde la API -->
            </div>

            <button type="button" id="logoutBtn" class="btn-danger">Cerrar Sesión</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
