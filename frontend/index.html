<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Campamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">
        <!-- SECCIÓN 1: LOGIN -->
        <div id="login-section">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario (Email):</label>
                    <input type="email" id="username" required placeholder="admin@campamento.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit">Entrar</button>
            </form>
            <div id="message"></div>
        </div>

        <!-- SECCIÓN 2: PANEL DE ACTIVIDADES, RESERVAS Y ADMIN -->
        <div id="dashboard-section" class="hidden">
            <h2>Panel de Actividades</h2>
            <p style="color: #666;">Listado de actividades disponibles en el campamento:</p>
            
            <div id="activities-list" class="activities-grid">
                <!-- Se cargan dinámicamente desde la API -->
            </div>

            <hr style="margin: 25px 0; border: none; border-top: 1px solid #ddd;">

            <h2>Mis Reservas</h2>
            <div id="my-bookings-list" class="activities-grid">
                <!-- Se cargan dinámicamente las reservas del usuario -->
            </div>

            <hr style="margin: 25px 0; border: none; border-top: 1px solid #ddd;">

            <h2>Crear Nueva Actividad (Admin)</h2>
            <form id="createActivityForm" style="margin-bottom: 20px; text-align: left;">
                <div class="form-group" style="margin-bottom: 10px;">
                    <label for="actName" style="font-size: 14px; font-weight: bold; color: #333;">Nombre:</label>
                    <input type="text" id="actName" required placeholder="Ej. Escalada en roca" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 10px;">
                    <label for="actDesc" style="font-size: 14px; font-weight: bold; color: #333;">Descripción:</label>
                    <input type="text" id="actDesc" placeholder="Breve descripción de la actividad" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 10px;">
                    <label for="actCapacity" style="font-size: 14px; font-weight: bold; color: #333;">Capacidad (Plazas):</label>
                    <input type="number" id="actCapacity" required placeholder="15" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="actPrice" style="font-size: 14px; font-weight: bold; color: #333;">Precio (€):</label>
                    <input type="number" step="0.01" id="actPrice" required placeholder="25.00" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <button type="submit" style="width: 100%; background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Crear Actividad</button>
            </form>
            <div id="admin-message" style="margin-bottom: 15px; font-size: 14px;"></div>

            <button type="button" id="logoutBtn" class="btn-danger">Cerrar Sesión</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
