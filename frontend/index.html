<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Campamentos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .btn-danger {
            background-color: #dc3545;
            margin-top: 15px;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .error { color: #dc3545; }
        .success { color: #28a745; }
        .hidden { display: none !important; }
        .activities-grid {
            display: grid;
            gap: 15px;
            margin-top: 15px;
        }
        .activity-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- SECCIÓN 1: LOGIN -->
        <div id="login-section">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario (Email):</label>
                    <input type="email" id="username" required placeholder="admin@campamento.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit">Entrar</button>
            </form>
            <div id="message"></div>
        </div>

        <!-- SECCIÓN 2: PANEL DE ACTIVIDADES (Se muestra tras hacer login) -->
        <div id="dashboard-section" class="hidden">
            <h2>Panel de Actividades</h2>
            <p style="color: #666;">Listado de actividades disponibles en el campamento:</p>
            
            <div id="activities-list" class="activities-grid">
                <!-- Se cargan dinámicamente desde la API -->
            </div>

            <button type="button" id="logoutBtn" class="btn-danger">Cerrar Sesión</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
